openapi: 3.0.3
info:
  title: TYI Control Gateway API
  version: 0.1.0
  description: >
    Reference API for the future mobile app integration against the
    control-gateway container. This document covers LAN discovery,
    pairing, session bootstrap, telemetry snapshots, log access, and
    WebRTC signaling bootstrap.
servers:
  - url: https://{host}:8443
    variables:
      host:
        default: uav-jetson.local
tags:
  - name: discovery
  - name: pairing
  - name: session
  - name: telemetry
  - name: navigation
  - name: stream
  - name: logs
  - name: webrtc
paths:
  /v1/discovery/self:
    get:
      tags: [discovery]
      summary: Read local device summary.
      operationId: getDiscoverySelf
      responses:
        '200':
          description: Device summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSummary'
  /v1/pairing/challenge:
    post:
      tags: [pairing]
      summary: Create a pairing challenge.
      operationId: createPairingChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientName]
              properties:
                clientName:
                  type: string
                platform:
                  type: string
                appVersion:
                  type: string
      responses:
        '200':
          description: Pairing challenge created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingChallenge'
  /v1/pairing/complete:
    post:
      tags: [pairing]
      summary: Complete pairing with a code or QR-derived secret.
      operationId: completePairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, proof]
              properties:
                deviceId:
                  type: string
                  deprecated: true
                  description: Legacy field. Current gateway does not require it.
                nonce:
                  type: string
                proof:
                  type: string
                requestedRole:
                  type: string
                  enum: [viewer, operator, maintainer]
      responses:
        '200':
          description: Pairing completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
  /v1/session/refresh:
    post:
      tags: [session]
      summary: Rotate access and refresh tokens for the current paired client.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
  /v1/session/logout:
    post:
      tags: [session]
      summary: Revoke the current paired client session.
      operationId: logoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Client session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
  /v1/device/state:
    get:
      tags: [telemetry]
      summary: Get a snapshot of current device and flight state.
      operationId: getDeviceState
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current state snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStateSnapshot'
  /v1/health/detail:
    get:
      tags: [telemetry]
      summary: Read detailed gateway health.
      operationId: getHealthDetail
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detailed health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSnapshot'
  /v1/stream/events:
    get:
      tags: [stream]
      summary: Subscribe to real-time state, health, alarm, and log events with SSE.
      operationId: streamEvents
      security:
        - bearerAuth: []
      parameters:
        - name: topics
          in: query
          schema:
            type: string
            example: state,health,alarm,log
      responses:
        '200':
          description: SSE stream. Emits an initial `snapshot`, then incremental events and periodic `heartbeat`.
          content:
            text/event-stream:
              schema:
                type: string
  /v1/pairing/clients:
    get:
      tags: [pairing]
      summary: List paired clients.
      operationId: listPairedClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paired clients.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PairedClient'
  /v1/pairing/clients/{clientId}:
    delete:
      tags: [pairing]
      summary: Revoke and remove a paired client.
      operationId: deletePairedClient
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paired client removed and related tokens revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingClientRemoval'
        '404':
          description: Paired client not found.
  /v1/logs/sources:
    get:
      tags: [logs]
      summary: List available log sources.
      operationId: listLogSources
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Log sources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
  /v1/logs/recent:
    get:
      tags: [logs]
      summary: Read recent logs.
      operationId: getRecentLogs
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Recent logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
  /v1/navigation/ground-and-plan:
    post:
      tags: [navigation]
      summary: Ground a natural-language target with VLM and publish a planner goal.
      operationId: groundAndPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroundAndPlanRequest'
      responses:
        '200':
          description: Planner goal published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroundAndPlanResponse'
        '400':
          description: Invalid request.
        '403':
          description: Operator role required.
        '404':
          description: Target not found in current frame.
        '422':
          description: Target found but no valid depth estimate is available.
        '503':
          description: ROS, odom, or planner is unavailable.
  /v1/webrtc/sessions:
    post:
      tags: [webrtc]
      summary: Create a media session and obtain WHEP / RTSP endpoints.
      operationId: createWebRtcSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: string
                  enum: [720p60, 720p30, 480p30]
                overlay:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebRtcSession'
  /v1/webrtc/sessions/{sessionId}/answer:
    post:
      tags: [webrtc]
      summary: Deprecated. WHEP handles SDP exchange directly with media-gateway.
      operationId: submitWebRtcAnswer
      security:
        - bearerAuth: []
      deprecated: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp]
              properties:
                sdp:
                  type: string
      responses:
        '410':
          description: Not used in the WHEP-based flow.
  /v1/webrtc/sessions/{sessionId}/ice:
    post:
      tags: [webrtc]
      summary: Deprecated. WHEP handles ICE exchange directly with media-gateway.
      operationId: submitWebRtcIceCandidate
      security:
        - bearerAuth: []
      deprecated: true
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate, sdpMid, sdpMLineIndex]
              properties:
                candidate:
                  type: string
                sdpMid:
                  type: string
                sdpMLineIndex:
                  type: integer
      responses:
        '410':
          description: Not used in the WHEP-based flow.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DeviceSummary:
      type: object
      required:
        - deviceId
        - displayName
        - model
        - firmwareVersion
        - gatewayVersion
        - paired
        - supportsWebRtc
      properties:
        deviceId:
          type: string
        displayName:
          type: string
        model:
          type: string
        firmwareVersion:
          type: string
        gatewayVersion:
          type: string
        paired:
          type: boolean
        requiresPairing:
          type: boolean
        supportsWebRtc:
          type: boolean
        supportsEventStream:
          type: boolean
        httpPort:
          type: integer
        discoveryUdpPort:
          type: integer
        pairingMethods:
          type: array
          items:
            type: string
        videoProfiles:
          type: array
          items:
            type: string
    PairingChallenge:
      type: object
      required: [deviceId, nonce, clientId, pairingMode, expiresInSec, supportedProofs, deviceFingerprint]
      properties:
        deviceId:
          type: string
        nonce:
          type: string
        clientId:
          type: string
        pairingMode:
          type: string
        pairingHint:
          type: string
        expiresInSec:
          type: integer
        supportedProofs:
          type: array
          items:
            type: string
        deviceFingerprint:
          type: string
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, role, clientId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSec:
          type: integer
        clientId:
          type: string
        role:
          type: string
          enum: [viewer, maintainer, operator]
    PairedClient:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        platform:
          type: string
        appVersion:
          type: string
        role:
          type: string
          enum: [viewer, maintainer, operator]
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        lastRefreshAt:
          type: string
          format: date-time
    PairingClientRemoval:
      type: object
      properties:
        removed:
          type: boolean
        clientId:
          type: string
        accessTokenCount:
          type: integer
        refreshTokenCount:
          type: integer
    DeviceStateSnapshot:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/DeviceSummary'
        flight:
          $ref: '#/components/schemas/FlightState'
        media:
          $ref: '#/components/schemas/MediaState'
        system:
          $ref: '#/components/schemas/SystemState'
        alarms:
          type: array
          items:
            $ref: '#/components/schemas/AlarmEvent'
        health:
          $ref: '#/components/schemas/HealthSnapshot'
    FlightState:
      type: object
      properties:
        connected:
          type: boolean
        armed:
          type: boolean
        mode:
          type: string
        batteryPercent:
          type: number
        voltage:
          type: number
        altitudeMeters:
          type: number
        speedMetersPerSecond:
          type: number
        gpsFix:
          type: integer
        satellites:
          type: integer
    MediaState:
      type: object
      properties:
        ok:
          type: boolean
        selectedDevice:
          type: string
        selectedProfile:
          type: object
          properties:
            format:
              type: string
            width:
              type: integer
            height:
              type: integer
            fps:
              type: integer
        availableProfiles:
          type: array
          items:
            type: string
        onlineProfiles:
          type: array
          items:
            type: string
        streamStats:
          $ref: '#/components/schemas/MediaStreamStats'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/MediaPathStatus'
        sessionCount:
          type: integer
    SystemState:
      type: object
      properties:
        gatewayUptimeSec:
          type: number
        loadAverage:
          type: array
          items:
            type: number
        memory:
          type: object
          properties:
            totalMiB:
              type: number
            availableMiB:
              type: number
            usedPercent:
              type: number
    HealthSnapshot:
      type: object
      properties:
        ok:
          type: boolean
        rosReady:
          type: boolean
        rosError:
          type: string
          nullable: true
        mediaReady:
          type: boolean
        mediaError:
          type: string
          nullable: true
        flightStateAgeSec:
          type: number
        mediaStateAgeSec:
          type: number
        systemStateAgeSec:
          type: number
        flightStateStale:
          type: boolean
        mediaStateStale:
          type: boolean
        systemStateStale:
          type: boolean
        pairedClientCount:
          type: integer
    GroundAndPlanRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          example: 飞向塑料袋橘子
        groundingInstruction:
          type: string
          description: Optional override for the internal VLM grounding prompt.
        model:
          type: string
          example: qwen3-vl-plus
        snapshotSource:
          type: string
          enum: [realsense, auto]
        depthRadiusPx:
          type: integer
          minimum: 1
        groundingTimeoutSec:
          type: number
        standoffDistanceM:
          type: number
          description: Stop short of the target by this distance.
        goalAltitudeOffsetM:
          type: number
        minimumGoalAltitudeM:
          type: number
    GroundAndPlanResponse:
      type: object
      properties:
        ok:
          type: boolean
        instruction:
          type: string
        groundingInstruction:
          type: string
        plannerGoalTopic:
          type: string
        goalFrameId:
          type: string
        goalWorldM:
          $ref: '#/components/schemas/Vector3'
        targetRelativeToBaseLinkM:
          $ref: '#/components/schemas/Vector3'
        adjustedTargetRelativeToBaseLinkM:
          $ref: '#/components/schemas/Vector3'
        goalWorldOffsetM:
          $ref: '#/components/schemas/Vector3'
        targetDistanceToBaseLinkM:
          type: number
        standoffDistanceM:
          type: number
        goalAltitudeOffsetM:
          type: number
        minimumGoalAltitudeM:
          type: number
        odomAgeSec:
          type: number
        vlm:
          type: object
    MediaStreamStats:
      type: object
      properties:
        pathCount:
          type: integer
        readyCount:
          type: integer
        onlineCount:
          type: integer
    MediaPathStatus:
      type: object
      properties:
        name:
          type: string
        ready:
          type: boolean
        online:
          type: boolean
        tracks:
          type: array
          items:
            type: string
        bytesReceived:
          type: integer
        bytesSent:
          type: integer
        readers:
          type: integer
    Vector3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
    AlarmEvent:
      type: object
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, warning, error, critical]
        source:
          type: string
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        source:
          type: string
        message:
          type: string
    LogoutResult:
      type: object
      properties:
        revoked:
          type: boolean
    WebRtcSession:
      type: object
      properties:
        sessionId:
          type: string
        profile:
          type: string
        encoder:
          type: string
        state:
          type: string
        selectedDevice:
          type: string
        viewerUrl:
          type: string
        whepUrl:
          type: string
        rtspUrl:
          type: string
        stream:
          type: object
          properties:
            signalingMode:
              type: string
              enum: [whep]
            path:
              type: string
            viewerPath:
              type: string
            whepPath:
              type: string
            rtspPath:
              type: string
            webrtcPort:
              type: integer
            rtspPort:
              type: integer
