services:
  flight-core:
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
      network: host
      args:
        UBUNTU_PORTS_MIRROR: ${UBUNTU_PORTS_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports}
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-http://snapshots.ros.org/noetic/final/ubuntu}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
  control-gateway:
    build:
      context: .
      dockerfile: docker/control-gateway/Dockerfile
      network: host
  pointcloud-gateway:
    build:
      context: .
      dockerfile: docker/pointcloud-gateway/Dockerfile
      network: host
  media-gateway:
    build:
      context: .
      dockerfile: docker/media-gateway/Dockerfile
      network: host
  planner:
    profiles:
      - planner
    image: ${PLANNER_IMAGE:-tyi/planner:0.1.0-local}
    container_name: ${PLANNER_CONTAINER_NAME:-tyi-planner}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - flight-core
    env_file:
      - .env
    environment:
      ROS_MASTER_PORT: ${ROS_MASTER_PORT:-11311}
      ROS_LOG_DIR: /opt/tyi/logs/planner/ros
      TYI_OPERATION_MODE: ${TYI_OPERATION_MODE:-dev}
      TYI_PLANNER_AUTOSTART: ${TYI_PLANNER_AUTOSTART:-true}
      TYI_PLANNER_DRONE_ID: ${TYI_PLANNER_DRONE_ID:-0}
      TYI_PLANNER_FLIGHT_TYPE: ${TYI_PLANNER_FLIGHT_TYPE:-1}
      TYI_PLANNER_ODOM_TOPIC: ${TYI_PLANNER_ODOM_TOPIC:-/tyi/e100/fastlio2/odom}
      TYI_PLANNER_LIVOX_TOPIC: ${TYI_PLANNER_LIVOX_TOPIC:-/livox/lidar}
      TYI_PLANNER_CMD_OUTPUT_TOPIC: ${TYI_PLANNER_CMD_OUTPUT_TOPIC:-/tyi_planner/mavros/setpoint_raw/local_shadow}
      TYI_PLANNER_ENABLE_ACCELERATION: ${TYI_PLANNER_ENABLE_ACCELERATION:-false}
      TYI_PLANNER_TARGET_X: ${TYI_PLANNER_TARGET_X:-2.0}
      TYI_PLANNER_TARGET_Y: ${TYI_PLANNER_TARGET_Y:-0.0}
      TYI_PLANNER_TARGET_Z: ${TYI_PLANNER_TARGET_Z:-1.0}
      TYI_PLANNER_MAX_VEL: ${TYI_PLANNER_MAX_VEL:-0.8}
      TYI_PLANNER_MAX_ACC: ${TYI_PLANNER_MAX_ACC:-1.2}
      TYI_PLANNER_POINT_STRIDE: ${TYI_PLANNER_POINT_STRIDE:-6}
      TYI_PLANNER_WATCHDOG_INTERVAL_SEC: ${TYI_PLANNER_WATCHDOG_INTERVAL_SEC:-20}
    volumes:
      - ./logs/planner:/opt/tyi/logs/planner
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ego_planner_node >/dev/null || exit 1"]
      interval: 120s
      timeout: 5s
      start_period: 20s
      retries: 3
    build:
      context: .
      dockerfile: docker/planner/Dockerfile
      network: host
      args:
        BASE_IMAGE: ${IMAGE_NAME:-crpi-zpvbhgsm3t97idht.cn-hangzhou.personal.cr.aliyuncs.com/tyi-tech/tyi_e100:0.1.2}
