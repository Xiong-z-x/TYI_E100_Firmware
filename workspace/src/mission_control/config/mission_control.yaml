rate_hz: 20.0
prestream_sec: 3.0
wait_ready_timeout_sec: 12.0
data_freshness_sec: 0.5
rate_window_sec: 4.0
odom_stability_window_sec: 3.0
setpoint_queue_size: 50
subscriber_queue_size: 100
odom_max_abs_position_m: 20.0
odom_max_abs_speed_mps: 4.0
odom_stable_horizontal_range_m: 0.12
odom_stable_vertical_range_m: 0.10
odom_stable_yaw_range_rad: 0.05236
odom_stable_speed_mps: 0.30
arm_channel_index: 5
kill_channel_index: 6
switch_pwm_threshold: 1500

setpoint_topic: /mavros/setpoint_raw/local
state_topic: /mavros/state
extended_state_topic: /mavros/extended_state
estimator_topic: /mavros/estimator_status
rc_topic: /mavros/rc/in
battery_topic: /mavros/battery
odom_topic: /mavros/local_position/odom
lidar_topic: /livox/lidar
imu_topic: /livox/imu
fastlio_topic: /tyi/e100/fastlio2/odom
vision_topic: /mavros/vision_pose/pose
set_mode_service: /mavros/set_mode
arming_service: /mavros/cmd/arming
vehicle_info_service: /mavros/vehicle_info_get
param_get_service: /mavros/param/get

preflight_receipt_path: /tmp/mission_control/precheck.receipt
preflight_observation_timeout_sec: 15.0
preflight_observation_window_sec: 3.0
preflight_receipt_max_age_sec: 120.0
mission_log_dir: /opt/uav/logs/mission-control

takeoff:
  climb_rate_mps: 0.40
  xy_tolerance_m: 0.20
  z_tolerance_m: 0.12
  speed_tolerance_mps: 0.25
  stable_sec: 1.2
  timeout_sec: 12.0

landing:
  descent_rate_mps: 0.40
  floor_height_m: 0.00
  z_tolerance_m: 0.06
  vertical_speed_tolerance_mps: 0.10
  stable_sec: 1.0
  timeout_sec: 10.0
  disarm_timeout_sec: 12.0
  auto_land_wait_sec: 30.0

test_flight:
  takeoff_height_m: 1.2
  takeoff_duration_sec: 3.0
  move_distance_m: 1.0
  move_duration_sec: 3.0
  hover_sec: 3.0
  land_duration_sec: 3.0
