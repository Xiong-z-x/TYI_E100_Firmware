services:
  realsense-dev:
    environment:
      REALSENSE_ROS_ENABLE: "true"
      REALSENSE_RGBD_SNAPSHOT_ENABLE: "true"
      REALSENSE_RGBD_STREAM_ENABLE: "true"
      REALSENSE_RELEASE_AFTER_QUERY: "false"
      REALSENSE_ROS_CONFIG_PATH: /opt/uav/configs/realsense/d435i_ros_calibration.yaml

  calibration-capture:
    profiles:
      - calibration
    image: ${CALIBRATION_CAPTURE_IMAGE:-tyi/calibration-capture:0.1.0-local}
    container_name: ${CALIBRATION_CAPTURE_CONTAINER_NAME:-calibration-capture}
    network_mode: host
    ipc: host
    restart: "no"
    depends_on:
      - flight-core
    env_file:
      - .env
    environment:
      ROS_MASTER_PORT: ${ROS_MASTER_PORT:-11311}
      ROS_MASTER_URI: http://127.0.0.1:${ROS_MASTER_PORT:-11311}
      ROS_HOSTNAME: 127.0.0.1
      ROS_LOG_DIR: /opt/tyi/logs/calibration-capture/ros
      CALIBRATION_BAG_DIR: /data/bags
      CALIBRATION_LIVOX_INPUT_TOPIC: ${CALIBRATION_LIVOX_INPUT_TOPIC:-/livox/lidar}
      CALIBRATION_POINTS_TOPIC: ${CALIBRATION_POINTS_TOPIC:-/livox/points}
      CALIBRATION_POINTS_FRAME_ID: ${CALIBRATION_POINTS_FRAME_ID:-livox_frame}
      CALIBRATION_IMAGE_TOPIC: ${CALIBRATION_IMAGE_TOPIC:-/d435i/color/image_raw}
      CALIBRATION_CAMERA_INFO_TOPIC: ${CALIBRATION_CAMERA_INFO_TOPIC:-/d435i/color/camera_info}
      CALIBRATION_DEPTH_TOPIC: ${CALIBRATION_DEPTH_TOPIC:-/d435i/aligned_depth_to_color/image_raw}
      CALIBRATION_RECORD_DEPTH: ${CALIBRATION_RECORD_DEPTH:-false}
      CALIBRATION_DURATION_SEC: ${CALIBRATION_DURATION_SEC:-15}
      CALIBRATION_WAIT_TIMEOUT_SEC: ${CALIBRATION_WAIT_TIMEOUT_SEC:-20}
    volumes:
      - ./logs/calibration-capture:/opt/tyi/logs/calibration-capture
      - ./calibration_data:/data
    build:
      context: .
      dockerfile: docker/calibration-capture/Dockerfile
      network: host
      args:
        BASE_IMAGE: ${IMAGE_NAME:-crpi-zpvbhgsm3t97idht.cn-hangzhou.personal.cr.aliyuncs.com/tyi-tech/tyi_e100:0.1.2}
