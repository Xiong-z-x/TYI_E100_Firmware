common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1
    scan_line: 4
    blind: 0.5
    timestamp_unit: 3
    scan_rate: 10

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 100.0
    extrinsic_est_en: false
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: false
    scan_bodyframe_pub_en: true
    odom_topic: "/tyi/e100/fastlio2/odom"
    path_topic: "/tyi/e100/fastlio2/path"
    cloud_topic: "/tyi/e100/fastlio2/pointcloud/keyframe"
    body_cloud_topic: "/tyi/e100/fastlio2/pointcloud/deskewed"
    effect_cloud_topic: "/tyi/e100/fastlio2/cloud_effected"
    map_cloud_topic: "/tyi/e100/fastlio2/map"
    odom_frame_id: "robot/odom"
    body_frame_id: "robot/base_link"
    queue_size: 10

pcd_save:
    pcd_save_en: false
    interval: -1
