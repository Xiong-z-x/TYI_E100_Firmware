services:
  realsense-dev:
    profiles:
      - realsense-dev
    image: tyi/realsense-dev:0.1.0-local
    container_name: TYI_VLN
    user: "0:0"
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROS_MASTER_PORT: ${ROS_MASTER_PORT:-11311}
      ROS_MASTER_URI: http://127.0.0.1:${ROS_MASTER_PORT:-11311}
      ROS_HOSTNAME: 127.0.0.1
      UAV_CONFIG_DIR: /opt/uav/configs
      REALSENSE_ROS_ENABLE: ${REALSENSE_ROS_ENABLE:-false}
      REALSENSE_ROS_CONFIG_PATH: ${REALSENSE_ROS_CONFIG_PATH:-/opt/uav/configs/realsense/d435i_ros.yaml}
      LIO_CONFIG_PATH: ${LIO_CONFIG_PATH:-/opt/uav/configs/fastlio2/mid360.yaml}
      REALSENSE_COLOR_WIDTH: ${REALSENSE_COLOR_WIDTH:-640}
      REALSENSE_COLOR_HEIGHT: ${REALSENSE_COLOR_HEIGHT:-480}
      REALSENSE_DEPTH_WIDTH: ${REALSENSE_DEPTH_WIDTH:-640}
      REALSENSE_DEPTH_HEIGHT: ${REALSENSE_DEPTH_HEIGHT:-480}
      REALSENSE_FPS: ${REALSENSE_FPS:-30}
      REALSENSE_SERIAL: ${REALSENSE_SERIAL:-}
      REALSENSE_WARMUP: ${REALSENSE_WARMUP:-20}
      REALSENSE_TIMEOUT_MS: ${REALSENSE_TIMEOUT_MS:-10000}
      REALSENSE_HTTP_HOST: ${REALSENSE_HTTP_HOST:-0.0.0.0}
      REALSENSE_HTTP_PORT: ${REALSENSE_HTTP_PORT:-8765}
      REALSENSE_AUTOSTART: ${REALSENSE_AUTOSTART:-false}
      REALSENSE_RELEASE_AFTER_QUERY: ${REALSENSE_RELEASE_AFTER_QUERY:-true}
      REALSENSE_RGBD_SNAPSHOT_ENABLE: ${REALSENSE_RGBD_SNAPSHOT_ENABLE:-false}
      REALSENSE_SNAPSHOT_REQUIRE_CACHED: ${REALSENSE_SNAPSHOT_REQUIRE_CACHED:-true}
      REALSENSE_SNAPSHOT_CACHE_MAX_AGE_SEC: ${REALSENSE_SNAPSHOT_CACHE_MAX_AGE_SEC:-0.35}
      REALSENSE_SNAPSHOT_WAIT_SEC: ${REALSENSE_SNAPSHOT_WAIT_SEC:-1.0}
      REALSENSE_RGBD_STREAM_ENABLE: ${REALSENSE_RGBD_STREAM_ENABLE:-false}
      REALSENSE_RGBD_STREAM_FPS: ${REALSENSE_RGBD_STREAM_FPS:-15}
      REALSENSE_RGBD_ALIGN_FPS: ${REALSENSE_RGBD_ALIGN_FPS:-2}
      REALSENSE_MJPEG_MAX_FPS: ${REALSENSE_MJPEG_MAX_FPS:-15}
      REALSENSE_JPEG_QUALITY: ${REALSENSE_JPEG_QUALITY:-75}
      REALSENSE_JPEG_OPTIMIZE: ${REALSENSE_JPEG_OPTIMIZE:-false}
      REALSENSE_JPEG_SUBSAMPLING: ${REALSENSE_JPEG_SUBSAMPLING:-2}
      MEDIA_GATEWAY_SNAPSHOT_URL: ${MEDIA_GATEWAY_SNAPSHOT_URL:-rtsp://127.0.0.1:8554/camera-1080p30}
      MEDIA_CAMERA_PREFERRED_DEVICE: ${MEDIA_CAMERA_PREFERRED_DEVICE:-/dev/v4l/by-path/platform-3610000.xhci-usb-0:1:1.3-video-index0}
      MEDIA_SNAPSHOT_TIMEOUT_SEC: ${MEDIA_SNAPSHOT_TIMEOUT_SEC:-10}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_VLM_BASE_URL: ${QWEN_VLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VLM_MODEL: ${QWEN_VLM_MODEL:-qwen3.6-plus}
      QWEN_VLM_ENABLE_THINKING: ${QWEN_VLM_ENABLE_THINKING:-false}
      QWEN_VLM_TIMEOUT_SEC: ${QWEN_VLM_TIMEOUT_SEC:-45}
      QWEN_VLM_DISABLE_PROXY: ${QWEN_VLM_DISABLE_PROXY:-true}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},dashscope.aliyuncs.com,dashscope-intl.aliyuncs.com
    volumes:
      - ./configs:/opt/uav/configs:ro
      - ./logs/realsense-dev:/opt/tyi/logs/realsense-dev
      - ./state/timebase:/opt/tyi/timebase:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    build:
      context: .
      dockerfile: docker/realsense-dev/Dockerfile
      network: host
      args:
        BASE_IMAGE: ${IMAGE_NAME:-crpi-zpvbhgsm3t97idht.cn-hangzhou.personal.cr.aliyuncs.com/tyi-tech/tyi_e100:0.1.2}
        LIBREALSENSE_TAG: ${LIBREALSENSE_TAG:-v2.55.1}
